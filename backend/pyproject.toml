[project]
name = "hargus-api"
version = "0.1.0"
description = "FastAPI backend and Temporal stubs for Hargus AI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  # Temporal
  "temporalio>=1.26.0",
  # LangChain / LangGraph
  "langgraph>=1.1.6",
  "langchain-core>=1.2.31",
  "langchain-community>=0.4.1",
  "langchain-text-splitters>=0.3.8",
  "langchain-ollama>=1.1.0",
  "langchain-openai>=1.1.14",
  "langchain-anthropic>=1.4.0",
  "langchain-aws>=1.4.4",
  "langchain-postgres>=0.0.17",
  # Observability
  "langfuse>=3.0.0,<5.0.0",
  # Database
  "sqlalchemy[asyncio]>=2.0.49",
  "asyncpg>=0.31.0",
  "alembic>=1.18.4",
  "pgvector>=0.2.5,<0.4",
  "psycopg[binary]>=3.2.0,<4.0.0",
  # Storage (boto3 is already a transitive dep of langchain-aws; no aioboto3 needed)
  "boto3>=1.42.42",
  "aiofiles>=25.1.0",
  # Document processing & PDF
  "weasyprint>=68.1",
  "jinja2>=3.1.0,<4.0.0",
  "pypdf>=6.10.2",
  # Utilities
  "httpx>=0.27.0,<1.0.0",
  "tenacity>=8.5.0,<10.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "httpx>=0.27.0,<1.0.0",
  "ruff>=0.6.0,<1.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "anyio>=4.0.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hargus_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
