services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: hargus
      POSTGRES_USER: hargus
      POSTGRES_PASSWORD: hargus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init-langfuse.sql:/docker-entrypoint-initdb.d/02-langfuse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hargus -d hargus"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: hargus
      POSTGRES_PWD: hargus
      POSTGRES_SEEDS: postgres
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

