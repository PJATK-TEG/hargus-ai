version: "3"

tasks:
  setup:
    desc: Install backend and frontend dependencies
    cmds:
      - task: backend:install
      - task: frontend:install

  api:
    desc: Start backend API in dev mode
    cmds:
      - task: backend:dev

  worker:
    desc: Start Temporal worker in dev mode
    cmds:
      - task: backend:worker

  check:
    desc: Run lint and tests for backend
    cmds:
      - task: backend:lint
      - task: backend:test

  frontend:install:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm install

  frontend:dev:
    desc: Start the Vite frontend
    dir: frontend
    cmds:
      - npm run dev

  frontend:build:
    desc: Build the frontend
    dir: frontend
    cmds:
      - npm run build

  backend:install:
    desc: Install backend dependencies with uv
    cmds:
      - uv sync --project backend --group dev

  backend:dev:
    desc: Start the FastAPI backend with uv
    cmds:
      - uv run --project backend uvicorn hargus_api.main:app --app-dir backend/src --reload --host 0.0.0.0 --port 8000

  backend:worker:
    desc: Start the Temporal worker stub
    cmds:
      - uv run --project backend python -m hargus_api.worker

  backend:start:
    desc: Start the FastAPI backend without reload
    cmds:
      - uv run --project backend uvicorn hargus_api.main:app --app-dir backend/src --host 0.0.0.0 --port 8000

  backend:migrate:
    desc: Run Alembic migrations (upgrade to head)
    cmds:
      - uv run --project backend alembic --config backend/alembic.ini upgrade head

  backend:migrate:new:
    desc: Generate a new Alembic migration (usage -- task backend:migrate:new -- -m "description")
    cmds:
      - uv run --project backend alembic --config backend/alembic.ini revision --autogenerate {{.CLI_ARGS}}

  backend:test:
    desc: Run backend tests
    cmds:
      - uv run --project backend pytest backend/tests

  backend:lint:
    desc: Lint backend code
    cmds:
      - uv run --project backend ruff check backend/src backend/tests

  backend:format:
    desc: Format backend code
    cmds:
      - uv run --project backend ruff format backend/src backend/tests

  docker:build:api:
    desc: Build the backend API image
    cmds:
      - docker build -f backend/Dockerfile -t hargus-api:local .

  docker:build:
    desc: Build backend and compose services
    cmds:
      - task: docker:build:api
      - docker compose build

  docker:up:
    desc: Start the local Docker stack
    cmds:
      - docker compose up --build

  docker:down:
    desc: Stop the local Docker stack
    cmds:
      - docker compose down

  db:up:
    desc: Start only local postgres in docker
    cmds:
      - docker compose up -d postgres

  db:down:
    desc: Stop local postgres in docker
    cmds:
      - docker compose stop postgres

  db:logs:
    desc: Stream postgres logs
    cmds:
      - docker compose logs -f postgres
